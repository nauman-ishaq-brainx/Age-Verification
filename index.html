<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Birth Date</title>
  <link rel="stylesheet" href="styles/application.css" />
</head>
<body>

  <div class="container">
    <h1>Birth Date</h1>

    <form onsubmit="myFunction(event)">
      <div class="section">
        <h3>Birth Date</h3>

        <div class="field">
          <label for="day">Day</label>
          <div class="inputs">
            <input id="day" type="text" placeholder="dd" required />
          </div>
        </div>

        <div class="field">
          <label for="month">Month</label>
          <div class="inputs">
            <input id="month" type="text" placeholder="mm" required />
          </div>
        </div>

        <div class="field">
          <label for="year">Year</label>
          <div class="inputs">
            <input id="year" type="text" placeholder="yyyy" required />
          </div>
        </div>

      </div>

      <button type="submit">Submit</button>
    </form>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
